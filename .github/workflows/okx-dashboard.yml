name: OKX market dashboard

on:
  schedule:
    # 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 Asia/Tokyo (UTC+9).
    - cron: '0 3,7,11,15,19,23 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: okx-dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect actual OKX data and build dashboard
        run: python dashboard.py
      - name: Upload CSV, PNG and PDF
        uses: actions/upload-artifact@v4
        with:
          name: okx-dashboard
          path: output/
          if-no-files-found: error
          retention-days: 90
